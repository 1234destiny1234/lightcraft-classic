[package]
name = "lcc-peer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Peer (L0): finds the app on other devices on the local network (multicast DNS service discovery), pairs with them (a code both screens show) and talks to paired devices over an encrypted, mutually authenticated channel. Native only."

[lints]
workspace = true

# sockets: native only (empty on the web)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lcc-brand = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
# pure Rust (RustCrypto / dalek, MIT/Apache-2.0), the versions already in the lock
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# SO_REUSEADDR / SO_REUSEPORT on the mDNS socket (several copies of the app on one machine)
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
lcc-testkit = { workspace = true }
