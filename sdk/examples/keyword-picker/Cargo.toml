[package]
name = "keyword-picker"
description = "Example plug-in: settings, a dialog that remembers, and a prepare step that offers the catalog's keywords"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lcc-plugin-sdk = { path = "../../plugin" }

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
strip = true
