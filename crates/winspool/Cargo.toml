[package]
name = "lcc-winspool"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows print spooler (L0): lists the system's printers and prints rendered pages to one through GDI. One of the crates allowed `unsafe` (Win32 calls); reports unsupported elsewhere."

# Opts out of the workspace lints only to keep `unsafe_code = "deny"` overridable for the single
# `win` module below; every other crate root has `#![forbid(unsafe_code)]`. See CLAUDE.md.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps"] } # MIT OR Apache-2.0

[dev-dependencies]
lcc-testkit = { workspace = true }
