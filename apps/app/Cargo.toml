[package]
name = "dac-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "app"

[[bin]]
name = "app"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["denoise"]
denoise = ["dac-engine/denoise"]
rawnind-model = ["denoise", "dac-engine/rawnind-model"]
# Open HEIC/HEIF photos (the optional dac-heif crate). Not default so distributors choose
# it (HEVC patents); build with `--features heif` to include it.
heif = ["dac-codecs/heif"]
# Sound for video playback and slideshow music (cpal; links libasound on Linux). See docs/video.md.
audio-out = ["dac-engine/audio-out"]

[dependencies]
dac-brand = { workspace = true }
dac-engine = { workspace = true, features = ["sam"] }
dac-sysmem = { workspace = true }
dac-ui-egui = { workspace = true }
dac-codecs = { workspace = true }
dac-raster = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "glow", "accesskit", "wayland", "x11"] }
# probing the window's renderer before it opens (`window_gpu`)
pollster = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for the desktop executable; build.rs only uses it when targeting Windows.
dac-brand = { workspace = true }
winresource = "0.1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }
