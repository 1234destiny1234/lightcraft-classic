[package]
name = "dac-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
dac-brand = { workspace = true }
dac-geom = { workspace = true }
dac-color = { workspace = true }
dac-raster = { workspace = true }
dac-develop = { workspace = true }
dac-scenes = { workspace = true }
dac-pipeline = { workspace = true }
dac-gpu = { workspace = true }
dac-catalog = { workspace = true }
dac-geo = { workspace = true }
dac-hash = { workspace = true }
dac-layout = { workspace = true }
dac-print = { workspace = true }
web-time = { workspace = true }
dac-preview = { workspace = true }
dac-codecs = { workspace = true }
dac-raw = { workspace = true }
dac-camdb = { workspace = true }
dac-denoise-core = { workspace = true }
dac-denoise = { workspace = true, optional = true }
dac-meta = { workspace = true }
dac-lensdb = { workspace = true }
dac-faces = { workspace = true }
miniz_oxide = { workspace = true }
dac-merge = { workspace = true }
dac-geocode = { workspace = true }
dac-psd = { workspace = true }
dac-actions = { workspace = true }
tiff = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
# Apply the font’s vertical substitutions and origins to Japanese watermarks.
harfrust = { version = "0.12", default-features = false, features = ["std"] }
unicode-segmentation = "1.13"
dac-segment = { workspace = true, optional = true }
# video clips: probe and poster frames (every call is `Unsupported` on wasm32)
dac-video = { workspace = true }

# model downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dac-fetch = { workspace = true }
dac-immich = { workspace = true }
dac-publish = { workspace = true }
dac-tether = { workspace = true }
dac-credentials = { workspace = true }
dac-webgallery = { workspace = true, features = ["sftp"] }
dac-plugins = { workspace = true }

# free disk space of a volume (Folders panel)
[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
rustix = { workspace = true }

[features]
# AI masks with SAM 3 (Object / Describe). Off for the web and CLI builds.
sam = ["dep:dac-segment"]
denoise = ["dep:dac-denoise", "dac-denoise/runtime", "dac-gpu/denoise"]
rawnind-model = ["denoise", "dac-denoise/rawnind-model", "dac-denoise-core/rawnind-model"]

[dev-dependencies]
# HDR JPEG XL tests read the file's colour encoding
jxl-oxide = { workspace = true }
# Lossless synthetic HEIC files (the import test; decoded when the codecs' `heif` feature is on).
dac-heif = { workspace = true, features = ["testdata"] }
libc = { workspace = true }
dac-tiff = { workspace = true }
wat = "1.228" # P4.3: plug-in test modules

# synthetic video clips for the import / poster tests (M14.2, M14.3)
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
filmcraft-h264enc = { git = "https://github.com/storytold/filmcraft", rev = "156086dc87282026aeec33f8a220e4629bccbe31" }
filmcraft-isobmff = { git = "https://github.com/storytold/filmcraft", rev = "156086dc87282026aeec33f8a220e4629bccbe31" }

[target.'cfg(windows)'.dependencies]
# free space on Windows (the Folders panel); its own unsafe FFI stays inside the crate
fs4 = { version = "1", default-features = false, features = ["sync"] }
