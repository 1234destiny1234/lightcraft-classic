# Immich version matrix (IMM-*): the ignored live tests of `dac-immich` against a throw-away Immich server in docker,
# once with the oldest supported release (v3.0.0, `MIN_VERSION`) and once with Immich's moving `release` tag.
# Needs no secrets: `cargo xtask immich seed` creates the admin user and API key on the fresh server.
name: Immich

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/immich/**'
      - 'xtask/immich/**'
      - 'xtask/src/immich.rs'
      - '.github/workflows/immich.yml'

permissions:
  contents: read

concurrency:
  group: immich-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: [min, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: immich-live
      - name: start Immich (${{ matrix.version }})
        run: cargo xtask immich up --version ${{ matrix.version }}
      - name: seed
        run: cargo xtask immich seed
      - name: live tests
        run: cargo test -p dac-immich --test live -- --ignored --test-threads=1
      - name: server logs
        if: failure()
        run: docker compose -p xtask-immich -f xtask/immich/compose.yml logs --tail 200 immich-server
      - name: stop
        if: always()
        run: cargo xtask immich down --volumes
