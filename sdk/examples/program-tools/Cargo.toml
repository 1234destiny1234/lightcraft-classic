[package]
name = "program-tools"
description = "Example plug-in: hands the selected photos to a program and records what it made"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lcc-plugin-sdk = { path = "../../plugin" }

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
strip = true
