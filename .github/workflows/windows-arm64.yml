# Windows on ARM: package the ARM64 release the way release.yml does (cross-compiled on an x64
# runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner, check the installed
# binaries are ARM64, run the CLI natively, and uninstall. (A native ARM64 `cargo test` job is left
# out for now: PdfCraft saw an intermittent access violation in egui UI tests there.)
name: Windows ARM64

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/build.rs"
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  schedule:
    - cron: "41 4 * * 1" # weekly, so drift in the runner images shows up
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  diag:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: ['["self-hosted","Windows","ARM64","lcc"]', '["self-hosted","Windows","X64","lcc"]']
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - shell: pwsh
        continue-on-error: true
        run: |
          whoami; $env:USERPROFILE; $env:PATH
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          Get-CimInstance Win32_OperatingSystem | Select Caption, Version
          Get-PSDrive C | Select Used, Free
          foreach ($c in 'cargo','rustup','rustc','git','dotnet','wix','pwsh','link','cl','signtool') { "$c => " + (Get-Command $c -ErrorAction SilentlyContinue).Source }
          if (Get-Command rustup -ErrorAction SilentlyContinue) { rustup show }
          $vw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vw) { & $vw -all -products * -format text -property installationPath; & $vw -all -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath }
          Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\*\*" -Directory -ErrorAction SilentlyContinue | Select -Expand FullName
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib\*\um" -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName; (Get-ChildItem $_.FullName -Directory).Name -join ',' }
          dotnet --list-sdks
          Get-ChildItem $env:RUNNER_TOOL_CACHE -ErrorAction SilentlyContinue | Select -Expand Name

  package:
    name: package (cross-compiled on x64)
    # Self-hosted x64 Windows runner (win0) cross-compiles; GitHub-hosted minutes are not used.
    runs-on: [self-hosted, Windows, X64, lcc]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-arm64-package
      # win0 has only the .NET runtime, and its runner account can't write to Program Files: the SDK and WiX go
      # into the runner's own tool cache.
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
        with:
          dotnet-version: 8.0.x
      - name: Install WiX
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TOOL_CACHE 'wix-5.0.2'
          if (-not (Test-Path (Join-Path $tools 'wix.exe'))) { dotnet tool install --tool-path $tools wix --version 5.0.2 }
          Add-Content -Path $env:GITHUB_PATH -Value $tools
      - name: Build and package (unsigned)
        shell: pwsh
        env:
          DIST: ${{ github.workspace }}\dist\arm64
        run: ./packaging/windows/package.ps1 -Arch arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-windows-arm64
          path: dist/arm64/*
          if-no-files-found: error
          retention-days: 7

  install:
    name: install and run on ARM64
    needs: package
    # Self-hosted Windows on ARM runner (SNAPDRAGON).
    runs-on: [self-hosted, Windows, ARM64, lcc]
    timeout-minutes: 30
    steps:
      # for brand.toml and packaging/windows/brand.ps1 (the product name lives only there)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-windows-arm64
          path: dist
      - name: Install the MSI, check it, run it, uninstall it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./packaging/windows/brand.ps1
          $appExe = "$($Brand.binary).exe"
          $cliExe = "$($Brand.cli_binary).exe"
          $msi = (Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "msiexec /i exited $($p.ExitCode)" }
          $dir = Join-Path $env:ProgramFiles $Brand.display_name
          foreach ($exe in $appExe, $cliExe) {
            $path = Join-Path $dir $exe
            if (-not (Test-Path $path)) { throw "$exe not installed in $dir" }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
            if ($machine -ne 0xAA64) { throw "$exe is for machine 0x$('{0:X}' -f $machine), not ARM64" }
            Write-Output "ok $path (ARM64)"
          }
          # The installed CLI runs natively on ARM64.
          $cli = Join-Path $dir $cliExe
          $out = & $cli --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Output $out; throw "$cliExe --version exited $LASTEXITCODE" }
          Write-Output "ok $cliExe --version: $($out.Trim())"
          $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited $($p.ExitCode)" }
          if (Test-Path (Join-Path $dir $appExe)) { throw "uninstall left $appExe behind" }
          Write-Output 'ok uninstalled'
